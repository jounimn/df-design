<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass object: example</title>
<style>
  :root { --face-display: Georgia, "Times New Roman", serif; --ground: #0a0b10; --ink: #ecebe6; --muted: #a09e95; --word: #f2efe6; --hint: #8fb6ff; }
  * { box-sizing: border-box; }
  html { background: var(--ground); color: var(--ink); }
  body { margin: 0; font: 400 18px/1.55 var(--face-display); }
  a { color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--hint); outline-offset: 3px; }
  .hero { position: relative; height: 100svh; min-height: 560px; overflow: clip; }
  .hero canvas, .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .copy { position: absolute; left: 8vw; bottom: 10vh; max-width: 30rem; }
  h1 { font: 400 clamp(36px, 4.5vw, 60px)/1.05 var(--face-display); letter-spacing: -0.02em; margin: 0 0 12px; }
  .copy p { margin: 0; color: var(--muted); }
  main { padding: 12vh 8vw; min-height: 150svh; max-width: 46rem; color: var(--muted); }
</style>
</head>
<body>
<section class="hero" aria-label="A ring of clear glass in front of a word">
  <canvas id="glass"></canvas>
  <img id="glass-fallback" src="glass-poster.jpg" alt="A ring of clear glass bending the word behind it" hidden>
  <div class="copy">
    <h1>Seen through glass</h1>
    <p>A ring of clear glass turns in front of a word and bends it. The pointer tilts the ring.</p>
  </div>
</section>
<main>
  <p>A test page for the glass-object card. The word behind the glass is drawn into the scene so the glass can bend it; the page's own heading is ordinary text.</p>
  <p><a href="../">Other examples</a></p>
</main>

<script src="canvas-loop.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('glass');
const css = getComputedStyle(document.documentElement);

// The word behind the glass is a texture on a plane, so the glass has something to refract. Drawn in code: no image.
function wordTexture() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = css.getPropertyValue('--word');
  g.font = '700 300px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('LUMEN', 1024, 270);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch { /* the loop shows the fallback */ }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(0, 0, 7);

if (renderer) {
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  // A studio environment generated in code (no HDR file): the glass needs something to reflect.
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.5;
}
// The transmission pass only sees opaque things: the ground is the scene background, and the word is cut out with
// alphaTest instead of being transparent, or the glass would show nothing behind it.
scene.background = new THREE.Color(css.getPropertyValue('--ground'));
const word = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), new THREE.MeshBasicMaterial({ map: wordTexture(), alphaTest: 0.5 }));
word.position.z = -1.6;
scene.add(word);

// Transmission renders the scene behind the object into a texture and bends it through the surface: thickness and
// ior set how far, dispersion splits the colours at the edges. It is one extra pass of the scene per frame.
const glass = new THREE.Mesh(
  new THREE.TorusGeometry(1.15, 0.42, 48, 128),
  new THREE.MeshPhysicalMaterial({ transmission: 1, thickness: 1.4, ior: 1.5, roughness: 0.04, dispersion: 4,
    iridescence: 0.25, iridescenceIOR: 1.3, clearcoat: 1, color: new THREE.Color(css.getPropertyValue('--hint')).lerp(new THREE.Color('#ffffff'), 0.75) }),
);
scene.add(glass);

let tiltX = 0, tiltY = 0, aimX = 0, aimY = 0, last = 0, width = 0, height = 0;
addEventListener('pointermove', (e) => { aimX = (e.clientY / innerHeight - 0.5) * 0.6; aimY = (e.clientX / innerWidth - 0.5) * 0.8; }, { passive: true });

function render(t) {
  if (canvas.width !== width || canvas.height !== height) {
    width = canvas.width; height = canvas.height;
    renderer.setSize(width, height, false); camera.aspect = width / height; camera.updateProjectionMatrix();
  }
  const dt = Math.min(0.05, last ? (t - last) / 1000 : 0); last = t;
  const k = 1 - Math.exp(-4 * dt);                                // frame-rate independent damping
  tiltX += (aimX - tiltX) * k; tiltY += (aimY - tiltY) * k;
  glass.rotation.set(0.5 + tiltX + 0.15 * Math.sin(t * 0.0004), t * 0.00035 + tiltY, 0.2);
  renderer.render(scene, camera);
}

dfCanvasLoop(canvas, {
  context: 'webgl2',
  maxDpr: 1.5,                                                    // transmission draws the scene twice: cap the pixels
  draw: (t) => render(t),
  poster: () => { last = 0; render(0); },
  restore: (gl) => gl.viewport(0, 0, canvas.width, canvas.height),
  fallback: '#glass-fallback',
});
</script>
</body>
</html>
