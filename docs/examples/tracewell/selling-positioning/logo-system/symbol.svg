<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="200" height="200" role="img" aria-label="Tracewell symbol">
  <!-- The brand's own mark, unchanged: a three-span trace waterfall. Root span, child span (the signal orange), grandchild. -->
  <rect x="1" y="3" width="18" height="2.5" rx="1" fill="#E9EBEE"/>
  <rect x="5" y="8.75" width="10" height="2.5" rx="1" fill="#FF6A1A"/>
  <rect x="9" y="14.5" width="6" height="2.5" rx="1" fill="#7A828D"/>
</svg>
