<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Virtual scroll page</title>
<style>
  /* The document never scrolls: window.scrollTo does nothing. Wheel events move a transform, as a virtual
     scroller or a smooth-scroll library does. */
  html, body { margin: 0; height: 100%; overflow: hidden; font: 20px/1.5 Georgia, serif; }
  #track { position: fixed; inset: 0 0 auto 0; will-change: transform; }
  .scene { height: 900px; display: grid; place-items: center; }
  .scene:nth-child(1) { background: #f4efe6; }
  .scene:nth-child(2) { background: #c9d6c3; }
  .scene:nth-child(3) { background: #23395b; color: #fff; }
  .scene:nth-child(4) { background: #e2a33c; }
  .scene:nth-child(5) { background: #7b2d26; color: #fff; }
</style>
</head>
<body>
  <main id="track">
    <section class="scene"><h1>Scene one</h1></section>
    <section class="scene"><h2>Scene two</h2></section>
    <section class="scene"><h2>Scene three</h2></section>
    <section class="scene"><h2>Scene four</h2></section>
    <section class="scene"><h2>Scene five, the end</h2></section>
  </main>
<script>
  const track = document.getElementById('track');
  let y = 0;
  addEventListener('wheel', (e) => {
    e.preventDefault();
    const max = track.offsetHeight - innerHeight;
    y = Math.max(0, Math.min(max, y + e.deltaY));
    track.style.transform = `translateY(${-y}px)`;
  }, { passive: false });
</script>
</body>
</html>
