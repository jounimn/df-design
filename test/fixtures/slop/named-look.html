<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Named look fixture</title>
<!-- df-design · waive focus-visible · trying to waive a Floor gate must be rejected -->
<style>
:root {
  --canvas: #F4F1EA;
  --ink: #2a2520;
  --brand: #D97757;
  --font-display: "Playfair Display", serif;
  --font-body: "Source Sans 3", sans-serif;
}
html, body { overflow-x: clip; }
body { background: var(--canvas); color: var(--ink); font-family: var(--font-body); }
h1 { font-family: var(--font-display); }
.btn { background: var(--brand); color: var(--canvas); }
</style>
</head>
<body>
<main>
  <h1>A warm, bookish page</h1>
  <p>Cream paper, a high-contrast serif and a terracotta accent.</p>
  <button class="btn">Read on</button>
</main>
</body>
</html>
