<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The commodity layer of a component catalogue: the dark twin of the named look, a border beam, placeholder pictures.">
<title>Catalogue tells</title>
<style>
  :root { --bg: #0a0a0a; --ink: #f5f5f5; --accent: #ff6a3d; --muted: #8a8a8a; --font-display: Archivo, "Helvetica Neue", sans-serif; --font-body: Archivo, sans-serif; --font-mono: "JetBrains Mono", monospace; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  h1 { font-family: var(--font-display); font-size: 64px; letter-spacing: -0.03em; }
  a:focus-visible { outline: 2px solid var(--accent); }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  .meta { font-family: var(--font-mono); color: var(--muted); }
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  .beam { position: relative; padding: 24px; border-radius: 8px; }
  .beam::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
    background: conic-gradient(from var(--angle), transparent 70%, var(--accent));
    -webkit-mask: linear-gradient(var(--ink) 0 0) content-box, linear-gradient(var(--ink) 0 0); -webkit-mask-composite: xor;
    animation: beam 4s linear infinite; }
  @keyframes beam { to { --angle: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .beam::before { animation: none; } }
</style>
</head>
<body>
<header><h1>Ship sites faster</h1><p class="meta">v2.0 release</p><a class="btn" href="#plans">See the plans</a></header>
<section><div class="beam"><h2>Plans</h2><img src="https://picsum.photos/600/400" alt="A picture" width="600" height="400"></div></section>
<section><h2>Gallery</h2><img src="art/dark-figure.jpg" alt="A figure in the dark" width="600" height="400"></section>
<section><h2>Stories</h2><img src="art/dark-figure.jpg" alt="A figure in the dark" width="600" height="400"></section>
<section id="plans"><h2>Pricing</h2><img src="art/dark-figure.jpg" alt="A figure in the dark" width="600" height="400"></section>
</body>
</html>
