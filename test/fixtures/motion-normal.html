<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Normal scrolling page</title>
<style>
  body { margin: 0; font: 20px/1.5 Georgia, serif; }
  section { height: 900px; display: grid; place-items: center; }
  section:nth-child(1) { background: #f4efe6; }
  section:nth-child(2) { background: #c9d6c3; }
  section:nth-child(3) { background: #23395b; color: #fff; }
  section:nth-child(4) { background: #e2a33c; }
  footer { height: 400px; background: #111; color: #eee; display: grid; place-items: center; }
</style>
</head>
<body>
  <section><h1>The first screen</h1></section>
  <section><h2>The second screen</h2></section>
  <section><h2>The third screen</h2></section>
  <section><h2>The fourth screen</h2></section>
  <footer><p>The end of the page</p></footer>
</body>
</html>
