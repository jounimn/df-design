<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyboard-driven page</title>
<style>
  /* The wheel is swallowed; only PageDown and Space move the scenes. */
  html, body { margin: 0; height: 100%; overflow: hidden; font: 20px/1.5 Georgia, serif; }
  #track { position: fixed; inset: 0 0 auto 0; }
  .scene { height: 900px; display: grid; place-items: center; }
  .scene:nth-child(1) { background: #f4efe6; }
  .scene:nth-child(2) { background: #23395b; color: #fff; }
  .scene:nth-child(3) { background: #e2a33c; }
</style>
</head>
<body>
  <main id="track">
    <section class="scene"><h1>Slide one</h1></section>
    <section class="scene"><h2>Slide two</h2></section>
    <section class="scene"><h2>Slide three</h2></section>
  </main>
<script>
  const track = document.getElementById('track');
  let i = 0;
  addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
  addEventListener('keydown', (e) => {
    if (e.key !== 'PageDown' && e.key !== ' ') return;
    e.preventDefault();
    i = Math.min(i + 1, track.children.length - 1);
    track.style.transform = `translateY(${-i * 900}px)`;
  });
</script>
</body>
</html>
